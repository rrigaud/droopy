[package]
name = "droopy"
version = "4.0.0"
description = "Droopy - DROpbox cOPY"
authors = ["Raphael Rigaud <rigaudr.dev@gmail.com>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
arboard = "3.4"
base64 = "0.22"
